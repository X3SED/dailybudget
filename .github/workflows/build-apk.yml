name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.dailybudget.app.BudgetTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SimpleDailyBudget-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SimpleDailyBudget-apk
          path: SimpleDailyBudget-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Simple Daily Budget 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Simple Daily Budget for Android (English / Français).
            Download the `.apk` below on your phone and open it to install.
            Télécharge le fichier `.apk` ci-dessous depuis ton téléphone et ouvre-le pour l'installer.
          files: SimpleDailyBudget-*.apk

      # Captures du README : non bloquant, une capture ratée ne doit pas empêcher la release.
      - name: Render screenshots
        id: screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.dailybudget.app.ScreenshotTest

      - name: Update README screenshots
        if: github.event_name == 'push' && steps.screenshots.outcome == 'success'
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update screenshots [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

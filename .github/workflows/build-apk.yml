name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BudgetDuJour-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudgetDuJour-apk
          path: BudgetDuJour-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Budget du jour 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK Android de « Budget du jour ».
            Télécharge le fichier `.apk` ci-dessous depuis ton téléphone et ouvre-le pour l'installer.
          files: BudgetDuJour-*.apk
